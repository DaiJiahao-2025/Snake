<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>宝箱抽奖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#162447">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/pixel-theme.css">
  <style>
    .px-chest-wrap {
      display: grid;
      gap: 14px;
      justify-items: center;
      margin-top: 14px;
    }
    .px-chest {
      width: 220px;
      height: 170px;
      position: relative;
      transform: translateZ(0);
      user-select: none;
    }
    .px-chest__base {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 10px;
      height: 88px;
      border: 2px solid rgba(42, 53, 83, 0.65);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0)) ,
        linear-gradient(180deg, #b87a2b, #7a4a16);
      box-shadow: 0 14px 26px rgba(5, 10, 25, 0.28);
    }
    .px-chest__stripe {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 48px;
      height: 18px;
      border-top: 2px solid rgba(12, 19, 38, 0.45);
      border-bottom: 2px solid rgba(12, 19, 38, 0.45);
      background: rgba(12, 19, 38, 0.10);
    }
    .px-chest__lock {
      position: absolute;
      left: 50%;
      bottom: 34px;
      width: 34px;
      height: 34px;
      transform: translateX(-50%);
      border-radius: 10px;
      border: 2px solid rgba(12, 19, 38, 0.55);
      background: linear-gradient(180deg, #ffd700, #caa400);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
    }
    .px-chest__lid {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 28px;
      height: 70px;
      transform-origin: 50% 100%;
      border: 2px solid rgba(42, 53, 83, 0.65);
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0)) ,
        linear-gradient(180deg, #cc8a33, #8a521b);
      box-shadow: 0 10px 22px rgba(5, 10, 25, 0.24);
    }
    .px-chest__shine {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(120px 90px at 50% 42%, rgba(246, 196, 69, 0.45), rgba(246, 196, 69, 0) 70%),
        radial-gradient(90px 70px at 32% 50%, rgba(0, 188, 212, 0.35), rgba(0, 188, 212, 0) 72%),
        radial-gradient(90px 70px at 68% 50%, rgba(102, 191, 255, 0.32), rgba(102, 191, 255, 0) 72%);
      filter: blur(0.4px);
    }
    .px-chest.px-chest--opening .px-chest__lid {
      animation: chestOpen 1200ms cubic-bezier(.2,.8,.2,1) forwards;
    }
    .px-chest.px-chest--opening .px-chest__shine {
      animation: chestShine 1200ms ease forwards;
    }
    .px-chest.px-chest--opening {
      animation: chestShake 380ms ease-in-out 0ms 2;
    }
    @keyframes chestOpen {
      0% { transform: rotateX(0deg) translateY(0); }
      45% { transform: rotateX(10deg) translateY(-2px); }
      100% { transform: rotateX(65deg) translateY(-18px); }
    }
    @keyframes chestShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      50% { transform: translateX(2px); }
      75% { transform: translateX(-1px); }
      100% { transform: translateX(0); }
    }
    @keyframes chestShine {
      0% { opacity: 0; }
      30% { opacity: 0.7; }
      100% { opacity: 0.2; }
    }
  </style>
</head>
<body class="px-app">
  <div id="toast-host" class="px-toast-host" aria-live="polite"></div>
  <main class="px-page">
    <div class="px-page__top">
      <h1>宝箱抽奖</h1>
      <div class="px-page__actions">
        <a class="px-btn" href="Store.html">商店</a>
        <a class="px-btn" href="SkinSelect.html">皮肤</a>
        <a class="px-btn" href="MapSelect.html">地图</a>
        <a class="px-btn px-btn--alt" href="Snake.html">返回游戏</a>
      </div>
    </div>

    <section class="px-card" aria-label="货币">
      <div class="currency">
        💎 <span id="diamonds">0</span>
        🪙 <span id="coins">0</span>
      </div>
      <div class="px-card__meta" style="margin-top:10px;">每次开箱消耗：<b id="cost"></b> 钻石。</div>
    </section>

    <section class="px-card" style="margin-top:14px;">
      <div class="px-chest-wrap">
        <div id="chest" class="px-chest" aria-label="宝箱动画">
          <div class="px-chest__shine"></div>
          <div class="px-chest__lid"></div>
          <div class="px-chest__base"></div>
          <div class="px-chest__stripe"></div>
          <div class="px-chest__lock"></div>
        </div>

        <button id="open-btn">开启宝箱</button>
        <div id="result" class="px-card__meta" style="text-align:center;"></div>
      </div>
    </section>
  </main>

  <script src="assets/storage.js"></script>
  <script src="assets/game-data.js"></script>
  <script src="assets/ui-pages.js"></script>
  <script>
    StorageUtil.migrate();
    document.getElementById("cost").textContent = GameData.GACHA.costDiamonds;

    function updateCurrency() {
      document.getElementById("diamonds").textContent = localStorage.getItem("shopDiamonds") || "0";
      document.getElementById("coins").textContent = localStorage.getItem("shopCoins") || "0";
    }

    function unlockAchievement(id) {
      const achievements = StorageUtil.ensureObject("achievements", {});
      if (achievements[id]) return;
      achievements[id] = Date.now();
      StorageUtil.saveJson("achievements", achievements);
      UIPages.toast(`成就解锁：${GameData.ACHIEVEMENTS.find(a => a.id === id)?.name || id}`);
    }

    function ensureUnlockSet(key, value) {
      const list = StorageUtil.ensureSet(key, []);
      if (!list.includes(value)) {
        list.push(value);
        StorageUtil.saveJson(key, list);
        return true;
      }
      return false;
    }

    function addInventory(itemId, amount) {
      const inv = StorageUtil.ensureObject("inventory", { shield: 0, boost: 0, multiplier: 0, magnet: 0 });
      inv[itemId] = (inv[itemId] || 0) + amount;
      StorageUtil.saveJson("inventory", inv);
      if (itemId === "shield") StorageUtil.setNumber("shieldCount", inv.shield || 0);
    }

    function applyReward(entry) {
      const result = document.getElementById("result");

      if (entry.type === "coins") {
        const coins = StorageUtil.getNumber("shopCoins", 0) + entry.amount;
        StorageUtil.setNumber("shopCoins", coins);
        result.textContent = `获得：🪙 金币 × ${entry.amount}`;
        return;
      }
      if (entry.type === "diamonds") {
        const diamonds = StorageUtil.getNumber("shopDiamonds", 0) + entry.amount;
        StorageUtil.setNumber("shopDiamonds", diamonds);
        result.textContent = `获得：💎 钻石 × ${entry.amount}`;
        return;
      }
      if (entry.type === "item") {
        addInventory(entry.itemId, entry.amount || 1);
        const name = GameData.SHOP_ITEMS.find(i => i.id === entry.itemId)?.name || entry.itemId;
        result.textContent = `获得：${name} × ${entry.amount || 1}`;
        return;
      }
      if (entry.type === "unlockSkin") {
        const ok = ensureUnlockSet("unlockedSkins", entry.skinId);
        if (ok) unlockAchievement("unlock_skin");
        if (!ok) {
          const diamonds = StorageUtil.getNumber("shopDiamonds", 0) + 5;
          StorageUtil.setNumber("shopDiamonds", diamonds);
          result.textContent = "重复皮肤 → 转换为 💎 钻石 × 5";
        } else {
          const skinName = GameData.SKINS.find(s => s.id === entry.skinId)?.name || entry.skinId;
          result.textContent = `解锁皮肤：${skinName}`;
        }
        return;
      }
      if (entry.type === "unlockMap") {
        const ok = ensureUnlockSet("unlockedMaps", entry.mapId);
        if (ok) unlockAchievement("unlock_map");
        if (!ok) {
          const diamonds = StorageUtil.getNumber("shopDiamonds", 0) + 5;
          StorageUtil.setNumber("shopDiamonds", diamonds);
          result.textContent = "重复地图 → 转换为 💎 钻石 × 5";
        } else {
          const mapName = GameData.MAPS.find(m => m.id === entry.mapId)?.name || entry.mapId;
          result.textContent = `解锁地图：${mapName}`;
        }
        return;
      }

      result.textContent = "获得：未知奖励";
    }

    updateCurrency();

    const chest = document.getElementById("chest");
    const btn = document.getElementById("open-btn");
    let busy = false;

    btn.addEventListener("click", () => {
      if (busy) return;
      const diamonds = StorageUtil.getNumber("shopDiamonds", 0);
      if (diamonds < GameData.GACHA.costDiamonds) {
        UIPages.toast("钻石不足！");
        return;
      }

      busy = true;
      btn.setAttribute("disabled", "true");
      document.getElementById("result").textContent = "";
      StorageUtil.setNumber("shopDiamonds", diamonds - GameData.GACHA.costDiamonds);
      updateCurrency();

      chest.classList.remove("px-chest--opening");
      void chest.offsetWidth;
      chest.classList.add("px-chest--opening");

      setTimeout(() => {
        const picked = GameData.weightedPick(GameData.GACHA.table);
        applyReward(picked);
        updateCurrency();
        busy = false;
        btn.removeAttribute("disabled");
      }, 1250);
    });
  </script>
</body>
</html>
