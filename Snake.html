<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <title>贪吃蛇游戏 - 多彩星星 & 彩虹蛇</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#162447">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=Press+Start+2P&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/pixel-theme.css">
  <script src="assets/storage.js"></script>
  <script src="assets/game-data.js"></script>
  <script src="assets/dungeon-assets.js"></script>
  <script src="assets/ui-pages.js"></script>
  <style>
    /* Minimal Layout Overrides - Colors from pixel-theme.css */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Main Layout */
    main {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1400px;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
    }

    aside#left-panel {
      flex: 0 0 220px;
      min-width: 200px;
    }

    aside#right-panel {
      flex: 0 0 220px;
      min-width: 200px;
    }

    section#center-panel {
      flex: 1;
      max-width: 600px;
      min-width: 320px;
    }

    /* Game Container */
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: relative;
    }

    #game-container h1 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--px-accent);
      text-shadow: 0 0 20px var(--px-accent);
    }

    /* Canvas */
    #game-canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 1/1;
      margin-bottom: 16px;
      background-color: transparent;
    }

    /* Score Container */
    #score-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
      margin-bottom: 12px;
    }

    .score-box {
      flex: 1;
      background: var(--px-surface);
      border: 2px solid var(--px-border);
      border-radius: var(--px-radius-sm);
      padding: 10px 16px;
      font-size: 0.7rem;
      color: var(--px-ink);
      text-align: center;
    }

    .score-box span {
      color: var(--px-accent);
      font-weight: bold;
    }

    /* Run Info */
    #run-info .score-box {
      font-size: 0.6rem;
    }

    /* Controls */
    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
    }

    /* Props Container */
    #props-container {
      background: var(--px-surface);
      border: 3px solid var(--px-border);
      border-radius: var(--px-radius);
      box-shadow: var(--px-shadow);
      padding: 14px;
      margin-top: 16px;
    }

    #item-bar button {
      width: 100%;
      font-size: 0.6rem;
      padding: 8px;
    }

    /* Instructions */
    #instructions-content {
      background: var(--px-surface);
      border: 3px solid var(--px-border);
      border-radius: var(--px-radius);
      padding: 14px;
      margin-top: 12px;
      display: none;
    }

    /* Right Panel Links */
    #shop-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #shop-container .px-btn {
      width: 100%;
      text-align: center;
      font-size: 0.7rem;
    }

    /* Settings Panel */
    #settings-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--px-surface);
      border: 3px solid var(--px-border);
      border-radius: var(--px-radius);
      padding: 24px;
      z-index: 1000;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.4);
      display: none;
      max-width: 90%;
      width: 400px;
    }

    #audio-controls>div,
    #customization {
      margin-bottom: 16px;
      text-align: center;
    }

    #audio-controls label,
    #customization label {
      font-size: 0.65rem;
      margin-right: 8px;
      color: var(--px-ink-soft);
    }

    #customization input[type="text"] {
      width: 100%;
      margin: 8px 0;
    }

    /* Buff Status Display */
    #buff-display {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 50;
    }

    /* Combo Display */
    #combo-display {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--px-font-pixel);
      font-size: 1.5rem;
      color: var(--px-warn);
      text-shadow:
        0 0 10px var(--px-warn),
        0 0 25px var(--px-warn),
        3px 3px 0 var(--px-bg0);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.2s ease;
    }

    #combo-display.show {
      opacity: 1;
      animation: comboPopIn 0.35s ease-out;
    }

    @keyframes comboPopIn {
      0% {
        transform: translateX(-50%) scale(0.4);
        opacity: 0;
      }

      50% {
        transform: translateX(-50%) scale(1.2);
      }

      100% {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
    }

    /* Score Popup */
    .score-popup {
      position: absolute;
      font-family: var(--px-font-pixel);
      font-size: 0.85rem;
      color: var(--px-accent2);
      text-shadow: 2px 2px 0 var(--px-bg0);
      pointer-events: none;
      z-index: 90;
      animation: scoreFloat 0.9s ease-out forwards;
    }

    @keyframes scoreFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-50px) scale(1.3);
      }
    }

    /* Responsive */
    @media (max-width: 900px) {
      main {
        flex-direction: column;
        align-items: center;
      }

      aside#left-panel,
      aside#right-panel {
        flex: none;
        width: 100%;
        max-width: 400px;
      }

      #shop-container {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      #shop-container .px-btn {
        width: auto;
      }
    }
  </style>
</head>

<body class="px-app">
  <div id="toast-host" class="px-toast-host" aria-live="polite"></div>
  <!-- 主结构区域 -->
  <main id="main-container">
    <!-- 左侧：游戏说明和道具展示 -->
    <aside id="left-panel">
      <button id="show-instructions">游戏说明</button>
      <div id="instructions-content">
        <h2>游戏说明</h2>
        <p>使用 ← ↑ → ↓ 或 WASD 控制贪吃蛇。</p>
        <p>不同食物具有不同效果，例如彩虹食物会让蛇变色，护盾可以防止自撞。</p>
        <button id="close-instructions">关闭</button>
      </div>
      <div id="props-container" aria-label="道具栏">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div style="font-family:'Press Start 2P', system-ui;font-size:12px;">道具</div>
          <div id="run-badges" style="font-family:'Press Start 2P', system-ui;font-size:12px;opacity:.85;"></div>
        </div>
        <div id="item-bar" style="display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;">
          <button id="use-shield">护盾(Q) × <span id="inv-shield">0</span></button>
          <button id="use-boost">疾行(1) × <span id="inv-boost">0</span></button>
          <button id="use-multiplier">倍率(2) × <span id="inv-multiplier">0</span></button>
          <button id="use-magnet">磁铁(3) × <span id="inv-magnet">0</span></button>
        </div>
      </div>
    </aside>

    <!-- 中间：游戏主体 -->
    <section id="center-panel">
      <div id="game-container">
        <h1>贪吃蛇游戏</h1>
        <div id="run-info"
          style="width:100%;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 12px;">
          <div id="run-mode" class="score-box">模式: -</div>
          <div id="run-goal" class="score-box">目标: -</div>
        </div>
        <div id="score-container">
          <div class="score-box">分数: <span id="score">0</span></div>
          <div class="score-box">最高分: <span id="high-score">0</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="controls">
          <button id="start-btn">开始游戏</button>
          <button id="pause-btn">暂停游戏</button>
          <button id="restart-btn">重新开始</button>
          <button id="settings-btn">设置</button>
        </div>
        <!-- Combo Display -->
        <div id="combo-display"></div>
        <!-- Buff Status Bar -->
        <div id="buff-display">
          <div id="buff-shield" class="px-buff px-buff--shield">
            <span class="px-buff__icon">🛡️</span>
            <span class="px-buff__name">护盾</span>
            <div class="px-buff__bar">
              <div class="px-buff__fill" style="width:100%"></div>
            </div>
          </div>
          <div id="buff-boost" class="px-buff px-buff--boost">
            <span class="px-buff__icon">⚡</span>
            <span class="px-buff__name">疾行</span>
            <div class="px-buff__bar">
              <div class="px-buff__fill" style="width:100%"></div>
            </div>
          </div>
          <div id="buff-multiplier" class="px-buff px-buff--multiplier">
            <span class="px-buff__icon">✨</span>
            <span class="px-buff__name">倍率</span>
            <div class="px-buff__bar">
              <div class="px-buff__fill" style="width:100%"></div>
            </div>
          </div>
          <div id="buff-magnet" class="px-buff px-buff--magnet">
            <span class="px-buff__icon">🧲</span>
            <span class="px-buff__name">磁铁</span>
            <div class="px-buff__bar">
              <div class="px-buff__fill" style="width:100%"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 右侧：商店和抽奖 -->
    <aside id="right-panel">
      <div id="shop-container">
        <a class="px-btn" href="Store.html">商店</a>
        <a class="px-btn" href="LevelSelect.html">关卡</a>
        <a class="px-btn" href="MapSelect.html">地图</a>
        <a class="px-btn" href="SkinSelect.html">皮肤</a>
        <a class="px-btn" href="Achievements.html">成就</a>
        <a class="px-btn" href="Leaderboard.html">排行榜</a>
        <a class="px-btn px-btn--alt" href="lottery.html">宝箱</a>
      </div>
    </aside>
  </main>

  <!-- 设置面板 -->
  <div id="settings-panel">
    <div id="audio-controls">
      <div>
        <label for="music-toggle">音乐开关:</label>
        <input type="checkbox" id="music-toggle" checked>
        <label for="sfx-toggle" style="margin-left:15px;">音效开关:</label>
        <input type="checkbox" id="sfx-toggle" checked>
      </div>
      <div>
        <label for="music-volume">音乐音量:</label>
        <input type="range" id="music-volume" min="0" max="100" value="100">
        <label for="sfx-volume" style="margin-left:15px;">音效音量:</label>
        <input type="range" id="sfx-volume" min="0" max="100" value="100">
      </div>
      <div>
        <label for="music-select">背景音乐:</label>
        <select id="music-select">
          <option value="Sounds/background1.mp3">背景音乐 1</option>
          <option value="Sounds/background2.mp3">背景音乐 2</option>
        </select>
      </div>
    </div>
    <div id="customization">
      <label for="bg-url">背景媒体链接：</label>
      <input type="text" id="bg-url" placeholder="输入图片或视频链接">
      <br><br>
      <label for="music-url">自定义背景音乐链接：</label>
      <input type="text" id="music-url" placeholder="输入音乐链接">
      <br><br>
      <label for="bg-alpha">背景透明度：</label>
      <input type="range" id="bg-alpha" min="0" max="100" value="100">
      <span id="alpha-value">100%</span>
      <br><br>
      <button onclick="applyCustomization()">应用自定义</button>
    </div>
    <button id="close-settings">关闭</button>
  </div>

  <!-- 音频资源 -->
  <audio id="eat-sound" src="Sounds/Oeat.mp3" preload="auto"></audio>
  <audio id="rainbow-eat-sound" src="Sounds/eatcolor.mp3" preload="auto"></audio>
  <audio id="game-over-sound" src="Sounds/fail.mp3" preload="auto"></audio>
  <audio id="background-music" src="Sounds/background1.mp3" loop preload="auto"></audio>
  <audio id="combo-sound" src="Sounds/begin.mp3" preload="auto"></audio>
  <audio id="shield-break-sound" src="Sounds/fail.mp3" preload="auto"></audio>

  <!-- 游戏脚本代码 -->
  <script>
    // 全局变量（使用 const 声明不变量，let 声明会变化的量）
    let customBgImage = null;
    let customBgVideo = null;
    let bgAlpha = 1.0;
    let paused = false;
    let directionChanged = false;
    let lastFoodTime = 0;
    let comboCounter = 0;
    let foods = [];
    const maxFoods = 3;
    let shieldActive = false;
    let shieldEndTime = 0;
    let starsEaten = 0, coinsEaten = 0, diamondsEaten = 0;

    StorageUtil.migrate();

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const restartBtn = document.getElementById('restart-btn');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');
    const musicToggle = document.getElementById('music-toggle');
    const sfxToggle = document.getElementById('sfx-toggle');
    const musicVolumeSlider = document.getElementById('music-volume');
    const sfxVolumeSlider = document.getElementById('sfx-volume');
    const musicSelect = document.getElementById('music-select');
    const runModeEl = document.getElementById('run-mode');
    const runGoalEl = document.getElementById('run-goal');
    const runBadgesEl = document.getElementById('run-badges');
    const invShieldEl = document.getElementById('inv-shield');
    const invBoostEl = document.getElementById('inv-boost');
    const invMultiplierEl = document.getElementById('inv-multiplier');
    const invMagnetEl = document.getElementById('inv-magnet');
    const useShieldBtn = document.getElementById('use-shield');
    const useBoostBtn = document.getElementById('use-boost');
    const useMultiplierBtn = document.getElementById('use-multiplier');
    const useMagnetBtn = document.getElementById('use-magnet');

    // Buff display elements
    const buffShieldEl = document.getElementById('buff-shield');
    const buffBoostEl = document.getElementById('buff-boost');
    const buffMultiplierEl = document.getElementById('buff-multiplier');
    const buffMagnetEl = document.getElementById('buff-magnet');
    const comboDisplayEl = document.getElementById('combo-display');

    // Combo system configuration
    const COMBO_WINDOW = 2000; // 2 seconds to continue combo
    let comboHideTimeout = null;

    const eatSound = document.getElementById('eat-sound');
    const rainbowEatSound = document.getElementById('rainbow-eat-sound');
    const gameOverSound = document.getElementById('game-over-sound');
    const comboSound = document.getElementById('combo-sound');
    const backgroundMusic = document.getElementById('background-music');
    const shieldBreakSound = document.getElementById('shield-break-sound');

    let gridCount = 30;
    let gridSize = canvas.width / gridCount;
    const tileCount = gridCount;
    let snake = [];
    let dx = 1, dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameSpeed = 150;
    let gameRunning = false;
    let gameOver = false;
    let growth = 0;
    let particles = [];
    let snakeRainbow = false;
    let rainbowTimer = 0;
    const rainbowDuration = 10000;
    let rgbTime = 0;

    let gameMode = localStorage.getItem('selectedMode') || 'endless';
    let selectedLevelId = parseInt(localStorage.getItem('selectedLevelId') || '1', 10);
    let selectedMapId = localStorage.getItem('selectedMapId') || 'meadow';
    let selectedSkinId = localStorage.getItem('selectedSkinId') || 'classic';
    let goalScore = 0;
    let baseSpeed = 150;
    let currentMap = null;
    let currentSkin = null;
    let obstacles = [];
    let obstacleSet = new Set();
    let boostUntil = 0;
    let multiplierUntil = 0;
    let magnetUntil = 0;

    // 音量及背景音乐设置
    musicVolumeSlider.addEventListener('input', () => {
      backgroundMusic.volume = musicVolumeSlider.value / 100;
    });
    sfxVolumeSlider.addEventListener('input', () => {
      const vol = sfxVolumeSlider.value / 100;
      eatSound.volume = rainbowEatSound.volume = gameOverSound.volume = comboSound.volume = vol;
    });
    backgroundMusic.volume = musicVolumeSlider.value / 100;
    eatSound.volume = rainbowEatSound.volume = gameOverSound.volume = comboSound.volume = sfxVolumeSlider.value / 100;

    musicSelect.addEventListener('change', () => {
      backgroundMusic.src = musicSelect.value;
      backgroundMusic.load();
      if (musicToggle.checked && !paused) {
        backgroundMusic.play();
      }
    });
    musicToggle.addEventListener('change', () => {
      musicToggle.checked && !paused ? backgroundMusic.play() : backgroundMusic.pause();
    });

    const playSound = (sound) => {
      if (sfxToggle.checked) {
        sound.currentTime = 0;
        sound.play();
      }
    };

    function loadInventory() {
      const inv = StorageUtil.ensureObject('inventory', { shield: 0, boost: 0, multiplier: 0, magnet: 0 });
      const shieldCount = StorageUtil.getNumber('shieldCount', inv.shield || 0);
      if (shieldCount !== (inv.shield || 0)) {
        inv.shield = shieldCount;
        StorageUtil.saveJson('inventory', inv);
      }
      return inv;
    }

    function saveInventory(inv) {
      StorageUtil.saveJson('inventory', inv);
      StorageUtil.setNumber('shieldCount', inv.shield || 0);
    }

    function updateInventoryDisplay() {
      const inv = loadInventory();
      invShieldEl.textContent = String(inv.shield || 0);
      invBoostEl.textContent = String(inv.boost || 0);
      invMultiplierEl.textContent = String(inv.multiplier || 0);
      invMagnetEl.textContent = String(inv.magnet || 0);
    }

    function unlockAchievement(id) {
      const achievements = StorageUtil.ensureObject('achievements', {});
      if (achievements[id]) return;
      achievements[id] = Date.now();
      StorageUtil.saveJson('achievements', achievements);
      if (window.UIPages && typeof UIPages.toast === 'function') {
        const name = (window.GameData?.ACHIEVEMENTS || []).find(a => a.id === id)?.name || id;
        UIPages.toast(`成就解锁：${name}`);
      }
    }

    function ensureUnlockSet(key, value) {
      const list = StorageUtil.ensureSet(key, []);
      if (!list.includes(value)) {
        list.push(value);
        StorageUtil.saveJson(key, list);
        return true;
      }
      return false;
    }

    function recordLeaderboard(key, scoreValue) {
      const leaderboards = StorageUtil.ensureObject('leaderboards', {});
      const list = Array.isArray(leaderboards[key]) ? leaderboards[key] : [];
      list.push({ score: scoreValue, date: new Date().toISOString().slice(0, 10) });
      list.sort((a, b) => b.score - a.score);
      leaderboards[key] = list.slice(0, 10);
      StorageUtil.saveJson('leaderboards', leaderboards);
    }

    function resolveRunConfig() {
      gameMode = localStorage.getItem('selectedMode') || 'endless';
      selectedLevelId = parseInt(localStorage.getItem('selectedLevelId') || '1', 10);
      selectedMapId = localStorage.getItem('selectedMapId') || 'meadow';
      selectedSkinId = localStorage.getItem('selectedSkinId') || 'classic';

      const unlockedSkins = new Set(StorageUtil.ensureSet('unlockedSkins', ['classic']));
      if (!unlockedSkins.has(selectedSkinId)) {
        selectedSkinId = 'classic';
        localStorage.setItem('selectedSkinId', selectedSkinId);
      }

      let level = (window.GameData?.LEVELS || []).find(l => l.id === selectedLevelId) || null;
      if (gameMode === 'level') {
        const unlockedMax = StorageUtil.getNumber('unlockedLevelMax', 1);
        if (selectedLevelId > unlockedMax) {
          selectedLevelId = unlockedMax;
          localStorage.setItem('selectedLevelId', String(selectedLevelId));
        }
        level = (window.GameData?.LEVELS || []).find(l => l.id === selectedLevelId) || (window.GameData?.LEVELS || [])[0] || null;
      }

      if (gameMode === 'level' && level) {
        selectedMapId = level.mapId;
        goalScore = level.goalScore;
        baseSpeed = level.baseSpeed;
      } else {
        const unlockedMaps = new Set(StorageUtil.ensureSet('unlockedMaps', ['meadow']));
        if (!unlockedMaps.has(selectedMapId)) {
          selectedMapId = 'meadow';
          localStorage.setItem('selectedMapId', selectedMapId);
        }
        goalScore = 0;
        baseSpeed = 150;
      }

      currentMap = (window.GameData?.MAPS || []).find(m => m.id === selectedMapId) || (window.GameData?.MAPS || [])[0] || null;
      currentSkin = (window.GameData?.SKINS || []).find(s => s.id === selectedSkinId) || (window.GameData?.SKINS || [])[0] || null;

      const badges = [];
      if (currentMap) badges.push(currentMap.name);
      if (currentSkin) badges.push(currentSkin.name);
      runBadgesEl.textContent = badges.join(' · ');

      if (gameMode === 'level' && level) {
        runModeEl.textContent = `模式: 关卡 ${level.id}`;
        runGoalEl.textContent = `目标: ${goalScore} 分`;
      } else {
        runModeEl.textContent = `模式: 自由`;
        runGoalEl.textContent = `目标: 冲刺高分`;
      }

      gameSpeed = baseSpeed;
      boostUntil = 0;
      multiplierUntil = 0;
      magnetUntil = 0;

      const pattern = gameMode === 'level' && level ? level.pattern : (selectedMapId === 'desert' ? 'pillars' : selectedMapId === 'ocean' ? 'cross' : selectedMapId === 'hell' ? 'ring' : 'none');
      obstacles = buildObstacles(pattern);
      obstacleSet = new Set(obstacles.map(p => `${p.x},${p.y}`));
    }

    function buildObstacles(pattern) {
      const list = [];
      const add = (x, y) => {
        if (x < 0 || y < 0 || x >= tileCount || y >= tileCount) return;
        list.push({ x, y });
      };
      const addRect = (x0, y0, x1, y1) => {
        for (let x = x0; x <= x1; x++) { add(x, y0); add(x, y1); }
        for (let y = y0; y <= y1; y++) { add(x0, y); add(x1, y); }
      };
      const addLine = (x0, y0, x1, y1) => {
        const dxl = Math.sign(x1 - x0);
        const dyl = Math.sign(y1 - y0);
        let x = x0, y = y0;
        add(x, y);
        while (x !== x1 || y !== y1) {
          if (x !== x1) x += dxl;
          if (y !== y1) y += dyl;
          add(x, y);
        }
      };

      if (pattern === 'none') {
        return list;
      }
      if (pattern === 'gates') {
        for (let x = 8; x <= tileCount - 9; x += 8) {
          for (let y = 5; y < tileCount - 5; y++) {
            if (y >= 12 && y <= 17) continue;
            add(x, y);
          }
        }
      } else if (pattern === 'lanes') {
        for (let x = 6; x <= tileCount - 7; x += 6) {
          for (let y = 3; y < tileCount - 3; y++) {
            if (y % 7 === 0) continue;
            add(x, y);
          }
        }
      } else if (pattern === 'pillars') {
        for (let y = 6; y <= tileCount - 7; y += 6) {
          for (let x = 6; x <= tileCount - 7; x += 6) {
            add(x, y); add(x + 1, y); add(x, y + 1);
          }
        }
      } else if (pattern === 'ring') {
        addRect(4, 4, tileCount - 5, tileCount - 5);
        addRect(8, 8, tileCount - 9, tileCount - 9);
        addLine(Math.floor(tileCount / 2), 4, Math.floor(tileCount / 2), 7);
        addLine(Math.floor(tileCount / 2), tileCount - 8, Math.floor(tileCount / 2), tileCount - 5);
      } else if (pattern === 'cross') {
        const mid = Math.floor(tileCount / 2);
        for (let i = 3; i < tileCount - 3; i++) {
          if (i % 6 === 0) continue;
          add(mid, i);
          add(i, mid);
        }
      } else if (pattern === 'islands') {
        const islands = [
          [6, 5], [18, 5],
          [4, 17], [20, 18],
          [11, 22],
        ];
        for (const [x, y] of islands) {
          addRect(x, y, x + 2, y + 2);
        }
      } else if (pattern === 'gauntlet') {
        for (let y = 4; y < tileCount - 4; y += 5) {
          const gapStart = y % 10 === 4 ? 8 : tileCount - 13;
          for (let x = 4; x < tileCount - 4; x++) {
            if (x >= gapStart && x <= gapStart + 5) continue;
            add(x, y);
          }
        }
      } else if (pattern === 'maze') {
        for (let x = 3; x < tileCount - 3; x++) {
          if (x % 2 === 0) add(x, 6);
          if (x % 3 === 0) add(x, tileCount - 7);
        }
        for (let y = 7; y < tileCount - 7; y++) {
          if (y % 2 === 1) add(6, y);
          if (y % 3 === 1) add(tileCount - 7, y);
        }
        for (let x = 9; x < tileCount - 9; x++) {
          if (x % 4 !== 0) add(x, 12);
          if (x % 5 !== 0) add(x, tileCount - 13);
        }
        for (let y = 10; y < tileCount - 10; y++) {
          if (y % 4 !== 0) add(12, y);
          if (y % 5 !== 0) add(tileCount - 13, y);
        }
      } else if (pattern === 'arena') {
        addRect(2, 2, tileCount - 3, tileCount - 3);
        for (let i = 6; i < tileCount - 6; i += 6) {
          addRect(i, i, i + 2, i + 2);
        }
      }

      const safeX0 = 6, safeY0 = 6, safeX1 = 14, safeY1 = 14;
      return list.filter(p => !(p.x >= safeX0 && p.x <= safeX1 && p.y >= safeY0 && p.y <= safeY1));
    }

    function getScoreMultiplier() {
      return Date.now() < multiplierUntil ? 2 : 1;
    }

    // Update buff status bar visuals
    function updateBuffBars() {

      // Shield
      if (shieldActive && now < shieldEndTime) {
        const pct = Math.max(0, (shieldEndTime - now) / 15000 * 100);
        buffShieldEl.classList.add('px-buff--active');
        buffShieldEl.querySelector('.px-buff__fill').style.width = pct + '%';
      } else {
        buffShieldEl.classList.remove('px-buff--active');
      }

      // Boost
      if (now < boostUntil) {
        const pct = Math.max(0, (boostUntil - now) / 7000 * 100);
        buffBoostEl.classList.add('px-buff--active');
        buffBoostEl.querySelector('.px-buff__fill').style.width = pct + '%';
      } else {
        buffBoostEl.classList.remove('px-buff--active');
      }

      // Multiplier
      if (now < multiplierUntil) {
        const pct = Math.max(0, (multiplierUntil - now) / 10000 * 100);
        buffMultiplierEl.classList.add('px-buff--active');
        buffMultiplierEl.querySelector('.px-buff__fill').style.width = pct + '%';
      } else {
        buffMultiplierEl.classList.remove('px-buff--active');
      }

      // Magnet
      if (now < magnetUntil) {
        const pct = Math.max(0, (magnetUntil - now) / 10000 * 100);
        buffMagnetEl.classList.add('px-buff--active');
        buffMagnetEl.querySelector('.px-buff__fill').style.width = pct + '%';
      } else {
        buffMagnetEl.classList.remove('px-buff--active');

    // Show combo display
    function showCombo(count) {
      if (count < 2) {
        comboDisplayEl.classList.remove('show');
        return;
      }
      comboDisplayEl.textContent = `COMBO x${count}`;
      comboDisplayEl.classList.remove('show');

      clearTimeout(comboHideTimeout);
      comboHideTimeout = setTimeout(() => {
        comboDisplayEl.classList.remove('show');

    // Create floating score popup
    function createScorePopup(x, y, points, isCombo = false) {
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = `+${points}`;
      if (isCombo) {
        popup.style.color = '#ffd93d';

      }

    function updateRunHud() {
      const now = Date.now();
      if (gameMode === 'level' && goalScore > 0) {
        runGoalEl.textContent = `目标: ${score}/${goalScore}`;
        return;
      }
      const buffs = [];
      if (now < boostUntil) buffs.push('疾行');
      if (now < multiplierUntil) buffs.push('倍率');
      if (now < magnetUntil) buffs.push('磁铁');
      runGoalEl.textContent = buffs.length > 0 ? `状态: ${buffs.join('+')}` : '目标: 冲刺高分';
    }

    function useItem(itemId) {
      if (!gameRunning || paused) return;
      const inv = loadInventory();
      const count = inv[itemId] || 0;
      if (count <= 0) {
        if (window.UIPages && typeof UIPages.toast === 'function') UIPages.toast('库存不足');
        return;
      }
      inv[itemId] = count - 1;
      saveInventory(inv);
      updateInventoryDisplay();

      const now = Date.now();
      if (itemId === 'shield') {
        shieldActive = true;
        shieldEndTime = now + 15000;
        playSound(eatSound);
      } else if (itemId === 'boost') {
        boostUntil = Math.max(boostUntil, now + 7000);
        playSound(comboSound);
      } else if (itemId === 'multiplier') {
        multiplierUntil = Math.max(multiplierUntil, now + 10000);
        playSound(rainbowEatSound);
      } else if (itemId === 'magnet') {
        magnetUntil = Math.max(magnetUntil, now + 10000);
        playSound(comboSound);
      }
    }

    // 绘制圆角矩形
    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
    }

    function hexToRGB(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `${r}, ${g}, ${b}`;
    }

    function getRGBColor(time) {
      const r = Math.sin(time * 0.3) * 127 + 128;
      const g = Math.sin(time * 0.3 + 2) * 127 + 128;
      const b = Math.sin(time * 0.3 + 4) * 127 + 128;
      return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
    }

    function createParticles(x, y, color) {
      const particleCount = 15;
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: x * gridSize + gridSize / 2,
          y: y * gridSize + gridSize / 2,
          size: Math.random() * 3 + 2,
          color: color === "rgb" ? getRGBColor(rgbTime + i) : color,
          speedX: (Math.random() - 0.5) * 5,
          speedY: (Math.random() - 0.5) * 5,
          life: 30
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].speedX;
        particles[i].y += particles[i].speedY;
        particles[i].life--;
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = particles[i].life / 30;
        ctx.fillStyle = particles[i].color === "rgb" ? getRGBColor(rgbTime) : particles[i].color;
        ctx.beginPath();
        ctx.arc(particles[i].x, particles[i].y, particles[i].size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 绘制星形，多彩支持
    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, isRainbow, color1, color2) {
      let rot = Math.PI / 2 * 3;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        let x = cx + Math.cos(rot) * outerRadius;
        let y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      let gradient;
      if (isRainbow) {
        gradient = ctx.createRadialGradient(cx, cy, innerRadius, cx, cy, outerRadius);
        gradient.addColorStop(0, getRGBColor(rgbTime));
        gradient.addColorStop(0.5, getRGBColor(rgbTime + 2));
        gradient.addColorStop(1, getRGBColor(rgbTime + 4));
      } else if (color1 && color2) {
        gradient = ctx.createRadialGradient(cx, cy, innerRadius, cx, cy, outerRadius);
        gradient.addColorStop(0, color1);
        gradient.addColorStop(1, color2);
      } else {
        gradient = ctx.createRadialGradient(cx, cy, innerRadius, cx, cy, outerRadius);
        gradient.addColorStop(0, "yellow");
        gradient.addColorStop(0.5, "orange");
        gradient.addColorStop(1, "red");
      }
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.lineWidth = isRainbow ? 1 : 2;
      ctx.strokeStyle = "white";
      ctx.stroke();
    }

    function spawnFood() {
      const pos = getRandomEmptyCell();
      const rnd = Math.random();
      let type;
      if (rnd < 0.16) type = "rainbow";
      else if (rnd < 0.30) type = "diamond";
      else if (rnd < 0.70) type = "coin";
      else if (rnd < 0.82) type = "shield";
      else if (rnd < 0.90) type = "boost";
      else if (rnd < 0.96) type = "multiplier";
      else type = "magnet";
      return { x: pos.x, y: pos.y, type: type };
    }

    function getRandomEmptyCell() {
      let pos, collision;
      do {
        pos = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
        collision = snake.some(s => s.x === pos.x && s.y === pos.y) ||
          foods.some(f => f.x === pos.x && f.y === pos.y) ||
          obstacleSet.has(`${pos.x},${pos.y}`);
      } while (collision);
      return pos;
    }

    function drawDiamond(ctx, cx, cy, size) {
      ctx.save();
      ctx.fillStyle = "#b9f2ff";
      ctx.beginPath();
      ctx.moveTo(cx, cy - size);
      ctx.lineTo(cx + size, cy);
      ctx.lineTo(cx, cy + size);
      ctx.lineTo(cx - size, cy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    function drawCoin(ctx, cx, cy, radius) {
      ctx.save();
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    function drawShield(ctx, cx, cy, size) {
      ctx.save();
      ctx.fillStyle = "#c0c0c0";
      ctx.beginPath();
      ctx.moveTo(cx, cy - size);
      ctx.quadraticCurveTo(cx + size, cy - size, cx + size, cy);
      ctx.lineTo(cx + size * 0.6, cy + size);
      ctx.lineTo(cx - size * 0.6, cy + size);
      ctx.lineTo(cx - size, cy);
      ctx.quadraticCurveTo(cx - size, cy - size, cx, cy - size);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    // 加载用户自定义设置，并应用保存的记忆
    function loadCustomization() {
      const savedBgUrl = localStorage.getItem("snakeBgUrl");
      if (savedBgUrl) {
        document.getElementById('bg-url').value = savedBgUrl;
        if (savedBgUrl.match(/\.(mp4|webm|ogg)$/i)) {
          const vid = document.createElement('video');
          vid.loop = true;
          vid.muted = true;
          vid.autoplay = true;
          vid.src = savedBgUrl;
          vid.onloadeddata = () => { customBgVideo = vid; };
          vid.onerror = () => { customBgVideo = null; };
        } else {
          const img = new Image();
          img.onload = () => { customBgImage = img; };
          img.onerror = () => { customBgImage = null; };
          img.src = savedBgUrl;
        }
      }
      const savedMusicUrl = localStorage.getItem("snakeMusicUrl");
      if (savedMusicUrl) {
        document.getElementById('music-url').value = savedMusicUrl;
        backgroundMusic.src = savedMusicUrl;
      }
      const savedAlpha = localStorage.getItem("snakeBgAlpha");
      if (savedAlpha !== null) {
        bgAlpha = parseFloat(savedAlpha);
        const sliderValue = Math.round(bgAlpha * 100);
        document.getElementById('bg-alpha').value = sliderValue;
        document.getElementById('alpha-value').textContent = sliderValue + '%';
      }
      updateShopDisplay();
    }

    // 自动保存设置函数，将当前设置存入 localStorage
    function autoSaveCustomization() {
      const bgUrl = document.getElementById('bg-url').value.trim();
      const musicUrl = document.getElementById('music-url').value.trim();
      localStorage.setItem("snakeBgUrl", bgUrl);
      localStorage.setItem("snakeMusicUrl", musicUrl);
      localStorage.setItem("snakeBgAlpha", bgAlpha);
    }

    // 为设置输入添加自动保存监听
    document.getElementById('bg-url').addEventListener('input', autoSaveCustomization);
    document.getElementById('music-url').addEventListener('input', autoSaveCustomization);
    document.getElementById('bg-alpha').addEventListener('input', function () {
      const sliderValue = this.value;
      bgAlpha = sliderValue / 100;
      document.getElementById('alpha-value').textContent = sliderValue + '%';
      autoSaveCustomization();
    });
    // 在窗口关闭前保存设置
    window.addEventListener('beforeunload', autoSaveCustomization);

    function applyCustomization() {
      const bgUrl = document.getElementById('bg-url').value.trim();
      const musicUrl = document.getElementById('music-url').value.trim();
      localStorage.setItem("snakeBgUrl", bgUrl);
      localStorage.setItem("snakeMusicUrl", musicUrl);
      localStorage.setItem("snakeBgAlpha", bgAlpha);
      customBgImage = null;
      customBgVideo = null;
      if (bgUrl) {
        if (bgUrl.match(/\.(mp4|webm|ogg)$/i)) {
          const vid = document.createElement('video');
          vid.loop = true;
          vid.muted = true;
          vid.autoplay = true;
          vid.src = bgUrl;
          vid.onloadeddata = () => { customBgVideo = vid; };
          vid.onerror = () => { alert("无法加载视频背景，请检查链接"); customBgVideo = null; };
        } else {
          const img = new Image();
          img.onload = () => { customBgImage = img; };
          img.onerror = () => { alert("无法加载图片背景，请检查链接"); customBgImage = null; };
          img.src = bgUrl;
        }
      }
      backgroundMusic.src = musicUrl || musicSelect.value;
      backgroundMusic.load();
      if (musicToggle.checked && !paused) {
        backgroundMusic.play();
      }
    }

    function resizeCanvas() {
      const container = document.getElementById('game-container');
      const containerWidth = container.clientWidth;
      const top = container.getBoundingClientRect().top;
      const availableHeight = Math.max(240, window.innerHeight - top - 24);
      const computedSize = Math.floor(Math.min(containerWidth, availableHeight));
      canvas.width = computedSize;
      canvas.height = computedSize;
      gridSize = canvas.width / gridCount;
    }

    function updateShopSystem() {
      let shopStars = parseInt(localStorage.getItem("shopStars")) || 0;
      let shopCoins = parseInt(localStorage.getItem("shopCoins")) || 0;
      let shopDiamonds = parseInt(localStorage.getItem("shopDiamonds")) || 0;
      shopStars += starsEaten;
      shopCoins += coinsEaten;
      shopDiamonds += diamondsEaten;
      localStorage.setItem("shopStars", shopStars);
      localStorage.setItem("shopCoins", shopCoins);
      localStorage.setItem("shopDiamonds", shopDiamonds);
    }

    function updateShopDisplay() {
      const shopStars = localStorage.getItem("shopStars") || 0;
      const shopCoins = localStorage.getItem("shopCoins") || 0;
      const shopDiamonds = localStorage.getItem("shopDiamonds") || 0;
      // 假设页面中存在对应的展示元素，若无请自行添加
      const shopStarsEl = document.getElementById("shop-stars");
      const shopCoinsEl = document.getElementById("shop-coins");
      const shopDiamondsEl = document.getElementById("shop-diamonds");
      if (shopStarsEl) shopStarsEl.textContent = shopStars;
      if (shopCoinsEl) shopCoinsEl.textContent = shopCoins;
      if (shopDiamondsEl) shopDiamondsEl.textContent = shopDiamonds;
    }

    function updatePropsDisplay() {
      updateInventoryDisplay();
    }

    function initGame() {
      resolveRunConfig();
      resizeCanvas();
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      score = 0;
      scoreElement.textContent = score;
      updateRunHud();
      highScoreElement.textContent = highScore;
      growth = 0;
      particles = [];
      snakeRainbow = false;
      rainbowTimer = 0;
      comboCounter = 0;
      lastFoodTime = 0;
      starsEaten = 0;
      coinsEaten = 0;
      diamondsEaten = 0;
      foods = [];
      for (let i = 0; i < maxFoods; i++) {
        foods.push(spawnFood());
      }
      gameOver = false;
      rgbTime = 0;
      directionChanged = false;
      shieldActive = false;
      boostUntil = 0;
      multiplierUntil = 0;
      magnetUntil = 0;
      lastTimestamp = 0;
      draw();
      updatePropsDisplay();
      if (musicToggle.checked && !paused) {
        backgroundMusic.play();
      }
    }

    function updateSnake() {
      const head = {
        x: (snake[0].x + dx + tileCount) % tileCount,
        y: (snake[0].y + dy + tileCount) % tileCount
      };
      snake.unshift(head);
      directionChanged = false;
    }

    function checkCollision() {
      for (let i = 1; i < snake.length; i++) {
        if (snake[0].x === snake[i].x && snake[0].y === snake[i].y) {
          if (shieldActive) {
            // 盾牌期间忽略自撞，不触发游戏结束
            return false;
          }
          return true;
        }
      }
      return false;
    }

    function updateGame() {
      const now = Date.now();
      gameSpeed = now < boostUntil ? Math.max(70, Math.floor(baseSpeed * 0.65)) : baseSpeed;
      updateSnake();

      if (obstacleSet.has(`${snake[0].x},${snake[0].y}`)) {
        if (shieldActive) {
          shieldActive = false;
          playSound(shieldBreakSound);
          createParticles(snake[0].x, snake[0].y, "#ffd700");
        } else {
          gameOverHandler();
          return;
        }
      }
      if (snakeRainbow) {
        rainbowTimer += gameSpeed;
        if (rainbowTimer >= rainbowDuration) {
          snakeRainbow = false;
          rainbowTimer = 0;
        }
      }
      rgbTime += 0.1;
      if (checkCollision()) {
        gameOverHandler();
        return;
      }
      for (let i = foods.length - 1; i >= 0; i--) {
        if (snake[0].x === foods[i].x && snake[0].y === foods[i].y) {
          const foodItem = foods[i];
          const now = Date.now();
          let basePoints = 0;
          switch (foodItem.type) {
            case "rainbow":
              playSound(rainbowEatSound);
              snakeRainbow = true;
              rainbowTimer = 0;
              basePoints = 10;
              growth += 2;
              createParticles(foodItem.x, foodItem.y, "rgb");
              starsEaten++;
              break;
            case "diamond":
              playSound(eatSound);
              basePoints = 30;
              growth += 3;
              createParticles(foodItem.x, foodItem.y, "#b9f2ff");
              diamondsEaten++;
              break;
            case "coin":
              playSound(eatSound);
              basePoints = 20;
              growth += 2;
              createParticles(foodItem.x, foodItem.y, "#ffd700");
              coinsEaten++;
              break;
            case "shield":
              playSound(eatSound);
              shieldActive = true;
              shieldEndTime = now + 15000; // 15秒后护盾失效
              basePoints = 5;
              growth += 1;
              createParticles(foodItem.x, foodItem.y, "#c0c0c0");
              break;
            case "boost":
              playSound(comboSound);
              boostUntil = Math.max(boostUntil, now + 7000);
              basePoints = 15;
              growth += 1;
              createParticles(foodItem.x, foodItem.y, "#62c6ff");
              break;
            case "multiplier":
              playSound(rainbowEatSound);
              multiplierUntil = Math.max(multiplierUntil, now + 10000);
              basePoints = 15;
              growth += 1;
              createParticles(foodItem.x, foodItem.y, "#b388ff");
              break;
            case "magnet":
              playSound(comboSound);
              magnetUntil = Math.max(magnetUntil, now + 10000);
              basePoints = 12;
              growth += 1;
              createParticles(foodItem.x, foodItem.y, "#00bcd4");
              break;
            default:
              playSound(eatSound);
              basePoints = 10;
              growth += 2;
          }

          // Combo system
          const comboNow = Date.now();
          if (comboNow - lastFoodTime < COMBO_WINDOW) {
            comboCounter++;
          } else {
            comboCounter = 1;
          }
          lastFoodTime = comboNow;

          // Calculate final score with combo bonus
          const comboBonus = comboCounter > 1 ? Math.floor(comboCounter * 0.5) : 0;
          const finalPoints = Math.floor((basePoints + comboBonus) * getScoreMultiplier());
          score += finalPoints;
          scoreElement.textContent = score;

          // Show visual feedback
          showCombo(comboCounter);
          const popupX = foodItem.x * gridSize + gridSize / 2;
          const popupY = foodItem.y * gridSize;
          createScorePopup(popupX, popupY, finalPoints, comboCounter > 1);

          if (score > highScore) {
            highScore = score;
            highScoreElement.textContent = highScore;
            localStorage.setItem('snakeHighScore', highScore);
          }
          if (coinsEaten === 1) unlockAchievement('first_coin');
          if (diamondsEaten === 1) unlockAchievement('first_diamond');
          if (score >= 300) unlockAchievement('score_300');
          if (score >= 600) unlockAchievement('score_600');
          foods.splice(i, 1);
        }
      }
      if (shieldActive && now > shieldEndTime) {
        shieldActive = false;
      }

      // Update buff status bars
      updateBuffBars();

      if (now < magnetUntil) {
        const head = snake[0];
        const radius = 4;
        for (const food of foods) {
          if (food.type !== "coin") continue;
          const dxm = ((head.x - food.x + tileCount) % tileCount);
          const dym = ((head.y - food.y + tileCount) % tileCount);
          const nx = dxm > tileCount / 2 ? -(tileCount - dxm) : dxm;
          const ny = dym > tileCount / 2 ? -(tileCount - dym) : dym;
          if (Math.abs(nx) + Math.abs(ny) > radius) continue;

          const stepX = nx === 0 ? 0 : Math.sign(nx);
          const stepY = stepX !== 0 ? 0 : (ny === 0 ? 0 : Math.sign(ny));
          const next = { x: (food.x + stepX + tileCount) % tileCount, y: (food.y + stepY + tileCount) % tileCount };
          const blocked = obstacleSet.has(`${next.x},${next.y}`) ||
            snake.some(s => s.x === next.x && s.y === next.y) ||
            foods.some(f => f !== food && f.x === next.x && f.y === next.y);
          if (!blocked) {
            food.x = next.x;
            food.y = next.y;
          }
        }
      }
      while (foods.length < maxFoods) {
        foods.push(spawnFood());
      }
      if (growth > 0) {
        growth--;
      } else {
        snake.pop();
      }
      updateRunHud();

      if (gameMode === 'level' && goalScore > 0 && score >= goalScore) {
        levelWinHandler();
      }
    }

    function drawMapBackground() {
      // Use procedural floor texture
      const floorPattern = ctx.createPattern(DungeonAssets.generateFloor(gridSize), 'repeat');
      ctx.fillStyle = floorPattern;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Add vignette/darkness overlay for dungeon atmosphere
      const gradient = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.width / 4, canvas.width / 2, canvas.height / 2, canvas.width);
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawObstacles() {
      if (!obstacles.length) return;

      const wallImg = DungeonAssets.generateWall(gridSize);
      for (const p of obstacles) {
        ctx.drawImage(wallImg, p.x * gridSize, p.y * gridSize);
      }
    }

    function draw() {
      if (customBgVideo && customBgVideo.readyState >= 2) {
        ctx.drawImage(customBgVideo, 0, 0, canvas.width, canvas.height);
      } else if (customBgImage) {
        ctx.drawImage(customBgImage, 0, 0, canvas.width, canvas.height);
      } else {
        drawMapBackground();
      }
      ctx.save();
      ctx.globalAlpha = 1 - bgAlpha;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
      drawObstacles();
      // 绘制食物
      for (let i = 0; i < foods.length; i++) {
        const foodCx = foods[i].x * gridSize + gridSize / 2;
        const foodCy = foods[i].y * gridSize + gridSize / 2;
        // Draw Food Items with Sprites
        const pad = 2;
        const size = gridSize - pad * 2;

        switch (foods[i].type) {
          case "rainbow":
            // Special animated star or potion? Let's use blue potion for now or coin
            ctx.drawImage(DungeonAssets.generateItem('potion_blue', gridSize), foodCx - gridSize / 2, foodCy - gridSize / 2);
            break;
          case "diamond":
            ctx.drawImage(DungeonAssets.generateItem('chest', gridSize), foodCx - gridSize / 2, foodCy - gridSize / 2);
            break;
          case "coin":
            ctx.drawImage(DungeonAssets.generateItem('coin', gridSize), foodCx - gridSize / 2, foodCy - gridSize / 2);
            break;
          case "shield":
            // Use blue potion for shield or maybe just draw a shield icon?
            // Reusing potion_blue for variety if needed, but let's stick to simple mapping
            ctx.drawImage(DungeonAssets.generateItem('potion_blue', gridSize), foodCx - gridSize / 2, foodCy - gridSize / 2);
            break;
          case "boost":
          case "multiplier":
          case "magnet":
            ctx.drawImage(DungeonAssets.generateItem('potion_blue', gridSize), foodCx - gridSize / 2, foodCy - gridSize / 2);
            break;
          default:
            // Regular food = Red Potion
            ctx.drawImage(DungeonAssets.generateItem('potion_red', gridSize), foodCx - gridSize / 2, foodCy - gridSize / 2);
        }
      }
      // 绘制蛇
      snake.forEach((segment, index) => {
        if (index === 0) {
          drawSnakeHead(segment, dx, dy);
        } else {
          // Body Segment
          const x = segment.x * gridSize;
          const y = segment.y * gridSize;

          if (shieldActive) {
            ctx.fillStyle = "#f1c40f"; // Gold
            ctx.shadowColor = "#f1c40f";
            ctx.shadowBlur = 10;
          } else {
            ctx.fillStyle = "#27ae60"; // Serpent scale green
            ctx.shadowBlur = 0;
          }

          // Draw a scale pattern
          ctx.fillRect(x + 2, y + 2, gridSize - 4, gridSize - 4);
          // Highlight
          ctx.fillStyle = "#2ecc71";
          ctx.fillRect(x + 4, y + 4, gridSize / 2, gridSize / 2);

          ctx.shadowBlur = 0;
        }
      });
      updateParticles();
    }

    let lastTimestamp = 0;
    function mainLoop(timestamp) {
      if (!gameRunning) return;
      if (paused) {
        lastTimestamp = timestamp;
        requestAnimationFrame(mainLoop);
        return;
      }
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaTime = timestamp - lastTimestamp;
      if (deltaTime > gameSpeed) {
        updateGame();
        lastTimestamp = timestamp;
      }
      draw();
      requestAnimationFrame(mainLoop);
    }

    pauseBtn.addEventListener('click', () => {
      if (!gameRunning) return;
      if (!paused) {
        paused = true;
        pauseBtn.textContent = "继续游戏";
        backgroundMusic.pause();
      } else {
        paused = false;
        pauseBtn.textContent = "暂停游戏";
        if (musicToggle.checked) backgroundMusic.play();
        lastTimestamp = 0;
        requestAnimationFrame(mainLoop);
      }
    });

    function drawSnakeHead(segment, dx, dy) {
      const x = segment.x * gridSize;
      const y = segment.y * gridSize;

      const headImg = DungeonAssets.generateSnakeHead(gridSize, shieldActive ? 'shield' : 'normal');

      // Rotate head based on direction
      ctx.save();
      ctx.translate(x + gridSize / 2, y + gridSize / 2);

      let angle = 0;
      if (dx === 1) angle = 0;
      else if (dx === -1) angle = Math.PI;
      else if (dy === 1) angle = Math.PI / 2;
      else if (dy === -1) angle = -Math.PI / 2;

      ctx.rotate(angle);
      // Draw image centered
      ctx.drawImage(headImg, -gridSize / 2, -gridSize / 2);
      ctx.restore();
    }

    function handleKeyDown(e) {
      if (!gameRunning || paused) return;
      if (directionChanged) return;
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (dy !== 1) { dx = 0; dy = -1; directionChanged = true; }
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (dy !== -1) { dx = 0; dy = 1; directionChanged = true; }
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (dx !== 1) { dx = -1; dy = 0; directionChanged = true; }
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (dx !== -1) { dx = 1; dy = 0; directionChanged = true; }
          break;
        case 'q':
        case 'Q':
          useItem('shield');
          break;
        case '1':
          useItem('boost');
          break;
        case '2':
          useItem('multiplier');
          break;
        case '3':
          useItem('magnet');
          break;
      }
    }

    function startGame() {
      if (gameRunning) return;
      initGame();
      paused = false;
      gameRunning = true;
      lastTimestamp = 0;
      requestAnimationFrame(mainLoop);
    }

    function restartGame() {
      gameRunning = false;
      initGame();
      paused = false;
      gameRunning = true;
      lastTimestamp = 0;
      requestAnimationFrame(mainLoop);
    }

    function levelWinHandler() {
      if (!gameRunning) return;
      gameRunning = false;
      gameOver = true;
      playSound(comboSound);
      backgroundMusic.pause();
      updateShopSystem();
      updateShopDisplay();

      const level = (window.GameData?.LEVELS || []).find(l => l.id === selectedLevelId) || null;
      const rewardCoins = 40 + selectedLevelId * 10;
      const rewardDiamonds = 2 + Math.floor(selectedLevelId / 2);
      StorageUtil.setNumber('shopCoins', StorageUtil.getNumber('shopCoins', 0) + rewardCoins);
      StorageUtil.setNumber('shopDiamonds', StorageUtil.getNumber('shopDiamonds', 0) + rewardDiamonds);

      const unlockedMax = StorageUtil.getNumber('unlockedLevelMax', 1);
      if (selectedLevelId >= unlockedMax) StorageUtil.setNumber('unlockedLevelMax', Math.min((window.GameData?.LEVELS || []).length, selectedLevelId + 1));

      const mapUnlocked =
        (selectedLevelId >= 3 && ensureUnlockSet('unlockedMaps', 'desert')) ||
        (selectedLevelId >= 5 && ensureUnlockSet('unlockedMaps', 'ocean')) ||
        (selectedLevelId >= 7 && ensureUnlockSet('unlockedMaps', 'hell'));
      const skinUnlocked =
        (selectedLevelId >= 2 && ensureUnlockSet('unlockedSkins', 'stardew')) ||
        (selectedLevelId >= 6 && ensureUnlockSet('unlockedSkins', 'ocean')) ||
        (selectedLevelId >= 10 && ensureUnlockSet('unlockedSkins', 'gold'));
      if (mapUnlocked) unlockAchievement('unlock_map');
      if (skinUnlocked) unlockAchievement('unlock_skin');

      if (selectedLevelId === 1) unlockAchievement('clear_1');
      if (selectedLevelId === 5) unlockAchievement('clear_5');
      if (selectedLevelId === 10) unlockAchievement('clear_10');

      const stats = StorageUtil.ensureObject('stats', { gamesPlayed: 0, totalScore: 0, bestScore: 0, levelsCleared: 0 });
      stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;
      stats.totalScore = (stats.totalScore || 0) + score;
      stats.bestScore = Math.max(stats.bestScore || 0, score);
      stats.levelsCleared = (stats.levelsCleared || 0) + 1;
      StorageUtil.saveJson('stats', stats);
      unlockAchievement('first_game');

      recordLeaderboard(`关卡-${selectedLevelId}-${currentMap ? currentMap.name : selectedMapId}`, score);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#2ecc71';
      ctx.font = '28px Arial';
      ctx.fillText('通关成功！', canvas.width / 2, canvas.height / 2 - 30);
      ctx.fillStyle = 'white';
      ctx.font = '18px Arial';
      ctx.fillText(`分数: ${score}  |  奖励: +${rewardCoins}金币 +${rewardDiamonds}钻石`, canvas.width / 2, canvas.height / 2 + 10);
      ctx.fillText('可前往“关卡”继续挑战', canvas.width / 2, canvas.height / 2 + 42);
    }

    function gameOverHandler() {
      gameOver = true;
      gameRunning = false;
      playSound(gameOverSound);
      backgroundMusic.pause();
      updateShopSystem();
      updateShopDisplay();

      const stats = StorageUtil.ensureObject('stats', { gamesPlayed: 0, totalScore: 0, bestScore: 0, levelsCleared: 0 });
      stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;
      stats.totalScore = (stats.totalScore || 0) + score;
      stats.bestScore = Math.max(stats.bestScore || 0, score);
      StorageUtil.saveJson('stats', stats);
      unlockAchievement('first_game');

      if (gameMode === 'level') recordLeaderboard(`关卡-${selectedLevelId}-${currentMap ? currentMap.name : selectedMapId}`, score);
      else recordLeaderboard(`自由-${currentMap ? currentMap.name : selectedMapId}`, score);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'red';
      ctx.font = '30px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = 'white';
      ctx.font = '20px Arial';
      ctx.fillText(`最终分数: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
      ctx.fillText('按"重新开始"按钮重玩', canvas.width / 2, canvas.height / 2 + 50);
    }

    // 事件监听
    document.getElementById("show-instructions").addEventListener("click", () => {
      document.getElementById("instructions-content").style.display = "block";
    });
    document.getElementById("close-instructions").addEventListener("click", () => {
      document.getElementById("instructions-content").style.display = "none";
    });
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', restartGame);

    useShieldBtn.addEventListener('click', () => useItem('shield'));
    useBoostBtn.addEventListener('click', () => useItem('boost'));
    useMultiplierBtn.addEventListener('click', () => useItem('multiplier'));
    useMagnetBtn.addEventListener('click', () => useItem('magnet'));

    document.addEventListener('keydown', handleKeyDown);

    let touchStartX = 0;
    let touchStartY = 0;
    let touchActive = false;
    canvas.addEventListener('touchstart', (e) => {
      if (!gameRunning || paused) return;
      const t = e.touches[0];
      if (!t) return;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchActive = true;
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (!touchActive || !gameRunning || paused || directionChanged) return;
      const t = e.touches[0];
      if (!t) return;
      const dxMove = t.clientX - touchStartX;
      const dyMove = t.clientY - touchStartY;
      const ax = Math.abs(dxMove);
      const ay = Math.abs(dyMove);
      if (Math.max(ax, ay) < 22) return;
      e.preventDefault();
      if (ax > ay) {
        if (dxMove > 0 && dx !== -1) { dx = 1; dy = 0; directionChanged = true; }
        else if (dxMove < 0 && dx !== 1) { dx = -1; dy = 0; directionChanged = true; }
      } else {
        if (dyMove > 0 && dy !== -1) { dx = 0; dy = 1; directionChanged = true; }
        else if (dyMove < 0 && dy !== 1) { dx = 0; dy = -1; directionChanged = true; }
      }
      touchActive = false;
    }, { passive: false });
    canvas.addEventListener('touchend', () => { touchActive = false; }, { passive: true });
    canvas.addEventListener('touchcancel', () => { touchActive = false; }, { passive: true });

    window.addEventListener('resize', () => {
      resizeCanvas();
      draw();
    });

    highScoreElement.textContent = highScore;

    // 选取设置按钮、设置面板和关闭设置按钮
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const closeSettingsBtn = document.getElementById('close-settings');

    // 显示/隐藏设置面板
    settingsBtn.addEventListener('click', () => {
      settingsPanel.style.display = 'block';
    });
    closeSettingsBtn.addEventListener('click', () => {
      settingsPanel.style.display = 'none';
    });

    loadCustomization();
    initGame();
  </script>
</body>
